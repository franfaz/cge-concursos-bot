name: CGE Concursos Bot

on:
  schedule:
    # Todos los días a las 10:00 y 18:00 UTC (07:00 y 15:00 hora Argentina)
    - cron: '0 10,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scraper.py

      - name: Commit seen_urls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.txt
          git diff --staged --quiet || git commit -m "Update seen URLs [skip ci]"
          git push
